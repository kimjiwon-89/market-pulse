# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name marketp.duckdns.org;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name marketp.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/marketp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketp.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~* ^/assets/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/actuator/ {
        proxy_pass http://api:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger-ui/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location /v3/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}
