server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.marketpulse.domain,com.marketpulse.infrastructure.token.domain
  configuration:
    map-underscore-to-camel-case: true

external:
  api:
    base-url: ${EXTERNAL_API_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${EXTERNAL_API_APP_KEY:}
    app-secret: ${EXTERNAL_API_APP_SECRET:}
    token-path: ${EXTERNAL_API_TOKEN_PATH:/oauth2/tokenP}

krx:
  api:
    base-url: ${KRX_API_BASE_URL:https://data-dbg.krx.co.kr/svc/apis}
    auth-key: ${KRX_AUTH_KEY:}

opendart:
  api:
    base-url: ${OPENDART_API_BASE_URL:https://opendart.fss.or.kr/api}
    key: ${OPENDART_API_KEY:}

market-pulse:
  quant:
    package-root: ${QUANT_MODEL_PACKAGE_ROOT:../../domains/quant-serving/packages}

app:
  cors:
    allowed-origins:
      - ${APP_CORS_ORIGIN_LOCAL_WEB:http://localhost:3000}
      - ${APP_CORS_ORIGIN_LOCAL_API:http://localhost:8080}
      - ${APP_CORS_ORIGIN_LOTTO:https://www.dhlottery.co.kr}
      - ${APP_CORS_ORIGIN_PROD:https://marketp.duckdns.org}
    allowed-methods:
      - GET
      - POST
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - "*"
    allow-credentials: true
  http:
    connect-timeout: ${APP_HTTP_CONNECT_TIMEOUT:5000}
    read-timeout: ${APP_HTTP_READ_TIMEOUT:5000}
