services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: ${DOCKER_USERNAME}/market-pulse-api:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-marketPulse}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      APP_SCHEDULER_ENABLED: ${APP_SCHEDULER_ENABLED:-false}
      QUANT_LIVE_PAPER_SCHEDULER_ENABLED: ${QUANT_LIVE_PAPER_SCHEDULER_ENABLED:-true}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_AUTH_USERNAME: ${ADMIN_USERNAME}
      APP_AUTH_PASSWORD: ${ADMIN_PASSWORD}
      EXTERNAL_API_APP_KEY: ${KIS_APP_KEY}
      EXTERNAL_API_APP_SECRET: ${KIS_APP_SECRET}
      KRX_AUTH_KEY: ${KRX_AUTH_KEY}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    depends_on:
      - redis
    restart: unless-stopped

  migrator:
    image: postgres:16-alpine
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-marketPulse}
      DB_USERNAME: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - /app/migrations:/migrations:ro
      - /app/apply-migrations.sh:/app/apply-migrations.sh:ro
    entrypoint: ["sh", "/app/apply-migrations.sh"]
    profiles:
      - deploy

  web:
    image: ${DOCKER_USERNAME}/market-pulse-web:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
