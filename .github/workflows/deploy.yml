name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 날짜 태그 생성
        id: date
        run: echo "tag=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: API 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: ./market-pulse-api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/market-pulse-api:latest
            ${{ secrets.DOCKER_USERNAME }}/market-pulse-api:${{ steps.date.outputs.tag }}

      - name: Web 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: ./market-pulse-web
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/market-pulse-web:latest
            ${{ secrets.DOCKER_USERNAME }}/market-pulse-web:${{ steps.date.outputs.tag }}

      - name: docker-compose.yml 동기화
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/app"
          overwrite: true

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            bash /app/deploy.sh
